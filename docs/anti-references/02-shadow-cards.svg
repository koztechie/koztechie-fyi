  <!-- Заборонений CTA з градієнтом і тінню -->
  <rect x="310" y="450" width="180" height="40" rx="12" fill="#0000001a"/>
  <rect x="310" y="445" width="180" height="40" rx="12" fill="#6366f1"/>
  <text x="400" y="470" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">See All Projects</text>

  <!-- Позначки порушень -->
  <g font-size="11" font-weight="600">
    <rect x="12" y="12" width="250" height="24" fill="#000c" rx="3"/>
    <text x="20" y="28" fill="#ff6b6b">§6.3 Картки з тінями (box-shadow)</text>
    <rect x="12" y="42" width="215" height="24" fill="#000c" rx="3"/>
    <text x="20" y="58" fill="#ff6b6b">§2.3 radius 16px &gt; 4px</text>
    <rect x="12" y="72" width="225" height="24" fill="#000c" rx="3"/>
    <text x="20" y="88" fill="#ff6b6b">Емодзі замість семантики</text>
