<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <!-- АНТИРЕФЕРЕНС 2: Карткова сітка з тінями та емодзі -->
  <!-- Порушено: DECISIONS.md §6.3. design-system.md §2.2, §2.3 -->

  <rect width="800" height="500" fill="#f7f8fc"/>
