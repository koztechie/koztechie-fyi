<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <!-- АНТИРЕФЕРЕНС 1: Градієнтний герой + шаблонне «Привіт, я…» -->
  <!-- Порушено: DECISIONS.md §6.1, §6.2. design-system.md §2.1 -->

  <!-- Заборонений градієнтний фон -->
  <defs>
    <linearGradient id="forbidden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#forbidden)"/>

  <!-- Заборонений аватар-кружок з тінню -->
  <circle cx="400" cy="130" r="52" fill="#ffffff33" stroke="#fff" stroke-width="2"/>

  <!-- Заборонений текст з text-shadow (імітація) -->
  <text x="400" y="245" text-anchor="middle" font-size="42" font-weight="800" fill="#fff">Hi, I'm Alex</text>
  <text x="400" y="285" text-anchor="middle" font-size="17" fill="#ffffffdd">A passionate full-stack developer crafting digital experiences</text>

  <!-- Заборонений CTA з градієнтом і заокругленням 30px -->
  <rect x="305" y="320" width="190" height="48" rx="24" fill="#ff6b6b"/>
  <text x="400" y="350" text-anchor="middle" font-size="16" fill="#fff" font-weight="600">View My Work</text>

  <!-- Заборонений секційний градієнт -->
  <rect y="410" width="800" height="90" fill="#0f0f1a"/>
  <text x="180" y="455" text-anchor="middle" font-size="30" font-weight="800" fill="#a78bfa">50+</text>
  <text x="180" y="478" text-anchor="middle" font-size="11" fill="#ffffff88" letter-spacing="2">PROJECTS</text>
  <text x="400" y="455" text-anchor="middle" font-size="30" font-weight="800" fill="#60a5fa">8 yrs</text>
  <text x="400" y="478" text-anchor="middle" font-size="11" fill="#ffffff88" letter-spacing="2">EXPERIENCE</text>
  <text x="620" y="455" text-anchor="middle" font-size="30" font-weight="800" fill="#a78bfa">100%</text>
  <text x="620" y="478" text-anchor="middle" font-size="11" fill="#ffffff88" letter-spacing="2">SATISFACTION</text>

  <!-- Позначки порушень -->
  <g font-size="11" font-weight="600">
    <rect x="12" y="12" width="215" height="24" fill="#000c" rx="3"/>
    <text x="20" y="28" fill="#ff6b6b">§6.1 Градієнтний герой</text>
    <rect x="12" y="42" width="255" height="24" fill="#000c" rx="3"/>
    <text x="20" y="58" fill="#ff6b6b">§6.2 «Hi, I'm…, a passionate…»</text>
    <rect x="12" y="72" width="200" height="24" fill="#000c" rx="3"/>
    <text x="20" y="88" fill="#ff6b6b">§2.1 linear-gradient</text>
  </g>
</svg>
