<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, sans-serif">
  <!-- ВАЙРФРЕЙМ: Головна -->
  <!-- design-system.md §9.1, sitemap.md рядок 17 -->

  <!-- Шапка -->
  <rect width="800" height="48" fill="#edeff3" stroke="#6b7482" stroke-width="0.5"/>
  <text x="20" y="30" font-size="14" font-weight="600" fill="#14181d">ВУЗОЛ-0</text>
  <text x="200" y="30" font-size="11" fill="#434955">ПРАКТИКА</text>
  <text x="300" y="30" font-size="11" fill="#434955">ЦВИНТАР</text>
  <text x="400" y="30" font-size="11" fill="#434955">БЛОГ</text>
  <text x="480" y="30" font-size="11" fill="#434955">ПОЕЗІЯ</text>
  <text x="700" y="30" font-size="11" fill="#0a5266" font-weight="600">УКР</text>
  <text x="725" y="30" font-size="11" fill="#6b7482">/</text>
  <text x="735" y="30" font-size="11" fill="#434955">ENG</text>

  <!-- Головний блок -->
  <text x="400" y="100" text-anchor="middle" font-size="28" font-weight="700" fill="#14181d">ВУЗОЛ-0</text>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#434955">Архівний вузол. Текст без прикрас.</text>

  <!-- Маніфест (уривок) -->
  <rect x="80" y="150" width="640" height="80" fill="#f7f8fa" stroke="#6b7482" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="100" y="175" font-size="10" fill="#0a5266" font-weight="600">МАНІФЕСТ</text>
  <text x="100" y="195" font-size="12" fill="#434955">Перелік того, чим цей сайт ніколи не буде.</text>
  <text x="100" y="215" font-size="11" fill="#6b7482">→ /manifest/</text>

  <!-- Три останні записи -->
  <text x="80" y="270" font-size="10" fill="#0a5266" font-weight="600">ОСТАННІ ЗАПИСИ</text>

  <!-- Запис 1 -->
  <rect x="80" y="285" width="640" height="50" fill="#f7f8fa" stroke="#6b7482" stroke-width="0.5"/>
  <text x="100" y="305" font-size="10" fill="#6b7482" font-family="monospace">ЗАПИС №42</text>
  <text x="100" y="325" font-size="13" fill="#14181d">Назва останнього запису</text>
  <text x="650" y="315" font-size="11" fill="#6b7482">≈ 5 хв</text>

  <!-- Запис 2 -->
  <rect x="80" y="345" width="640" height="50" fill="#f7f8fa" stroke="#6b7482" stroke-width="0.5"/>
  <text x="100" y="365" font-size="10" fill="#6b7482" font-family="monospace">ЗАПИС №41</text>
  <text x="100" y="385" font-size="13" fill="#14181d">Назва передостаннього запису</text>
  <text x="650" y="375" font-size="11" fill="#6b7482">≈ 8 хв</text>

  <!-- Запис 3 -->
  <rect x="80" y="405" width="640" height="50" fill="#f7f8fa" stroke="#6b7482" stroke-width="0.5"/>
  <text x="100" y="425" font-size="10" fill="#6b7482" font-family="monospace">ЗАПИС №40</text>
  <text x="100" y="445" font-size="13" fill="#14181d">Назва третього запису</text>
  <text x="650" y="435" font-size="11" fill="#6b7482">≈ 3 хв</text>

  <!-- Підвал -->
  <rect y="500" width="800" height="100" fill="#edeff3" stroke="#6b7482" stroke-width="0.5"/>
  <text x="20" y="525" font-size="10" fill="#434955">© 2026 Eugene Kozlovsky</text>
  <text x="20" y="545" font-size="10" fill="#0a5266">RSS</text>
  <text x="60" y="545" font-size="10" fill="#0a5266">hello@koztechie.fyi</text>
  <text x="20" y="575" font-size="10" fill="#6b7482">Зроблено в Києві. Під час сирен.</text>

  <!-- Позначки -->
  <g font-size="9" font-weight="600">
    <rect x="12" y="56" width="80" height="18" fill="#0a5266" rx="2"/>
    <text x="18" y="69" fill="#fff">header.njk</text>
    <rect x="12" y="488" width="75" height="18" fill="#0a5266" rx="2"/>
    <text x="18" y="501" fill="#fff">footer.njk</text>
    <rect x="740" y="88" width="50" height="18" fill="#0a5266" rx="2"/>
    <text x="746" y="101" fill="#fff">h1</text>
    <rect x="730" y="158" width="60" height="18" fill="#0a5266" rx="2"/>
    <text x="736" y="171" fill="#fff">уривок</text>
    <rect x="730" y="258" width="60" height="18" fill="#0a5266" rx="2"/>
    <text x="736" y="271" fill="#fff">останні 3</text>
  </g>
</svg>
