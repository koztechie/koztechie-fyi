<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="system-ui, sans-serif">
  <!-- ІСТОРИЧНИЙ ЕСКІЗ, НЕ ЧИННИЙ РЕФЕРЕНС. Після R3.6 використовуйте docs/design-system.md. -->
  <!-- ВАЙРФРЕЙМ: Стаття (пост блогу) -->
  <!-- design-system.md §9.2, content-model.md §5.1 -->

  <!-- Шапка -->
  <rect width="800" height="48" fill="#edeff3" stroke="#6b7482" stroke-width="0.5"/>
  <text x="20" y="30" font-size="14" font-weight="600" fill="#14181d">ВУЗОЛ-0</text>
  <text x="200" y="30" font-size="11" fill="#434955">БЛОГ</text>
  <text x="700" y="30" font-size="11" fill="#0a5266" font-weight="600">УКР</text>
  <text x="725" y="30" font-size="11" fill="#6b7482">/</text>
  <text x="735" y="30" font-size="11" fill="#434955">ENG</text>

  <!-- Лінійка запису -->
  <text x="80" y="85" font-size="10" fill="#6b7482" font-family="monospace" letter-spacing="1">ЗАПИС №42</text>

  <!-- Заголовок (мікрогліч) -->
  <text x="80" y="120" font-size="24" font-weight="700" fill="#14181d">Назва запису українською</text>

  <!-- Метадані -->
  <text x="80" y="148" font-size="11" fill="#434955">18 жовтня 2026 · ≈ 5 хв</text>

  <!-- Лінійка-роздільник -->
  <line x1="80" y1="165" x2="720" y2="165" stroke="#6b7482" stroke-width="0.5"/>

  <!-- Тіло з буквицею -->
  <text x="80" y="200" font-size="32" font-weight="400" fill="#14181d" font-family="Georgia, serif">П</text>
  <text x="102" y="200" font-size="14" fill="#14181d" font-family="Georgia, serif">ерший абзац тексту з буквицею. Буквиця</text>
  <text x="80" y="222" font-size="14" fill="#14181d" font-family="Georgia, serif">займає три рядки та стоїть зліва. Решта тексту</text>
  <text x="80" y="244" font-size="14" fill="#14181d" font-family="Georgia, serif">обгортається навколо неї природним чином.</text>

  <!-- Другий абзац -->
  <text x="80" y="280" font-size="14" fill="#14181d" font-family="Georgia, serif">Другий абзац. Текст набрано засічковим шрифтом</text>
  <text x="80" y="302" font-size="14" fill="#14181d" font-family="Georgia, serif">з line-height 1.6 та максимальною шириною 68ch.</text>
  <text x="80" y="324" font-size="14" fill="#14181d" font-family="Georgia, serif">Це класична книжкова типографіка для екрана.</text>

  <!-- Блок коду -->
  <rect x="80" y="350" width="640" height="50" fill="#edeff3" stroke="#6b7482" stroke-width="0.5"/>
  <text x="100" y="380" font-size="12" fill="#434955" font-family="monospace">npm run check</text>

  <!-- Третій абзац -->
  <text x="80" y="430" font-size="14" fill="#14181d" font-family="Georgia, serif">Третій абзац після блоку коду. Моноширинний</text>
  <text x="80" y="452" font-size="14" fill="#14181d" font-family="Georgia, serif">шрифт використовується лише для коду та міток.</text>

  <!-- Попередження (опційно) -->
  <rect x="80" y="480" width="640" height="30" fill="#f7f8fa" stroke="#6b7482" stroke-width="0.5"/>
  <text x="100" y="500" font-size="11" fill="#434955">Попередження: текст містить опис військових дій.</text>

  <!-- Підвал -->
  <rect y="600" width="800" height="100" fill="#edeff3" stroke="#6b7482" stroke-width="0.5"/>
  <text x="20" y="625" font-size="10" fill="#434955">© 2026 Eugene Kozlovsky</text>
  <text x="20" y="645" font-size="10" fill="#0a5266">RSS</text>

  <!-- Позначки -->
  <g font-size="9" font-weight="600">
    <rect x="12" y="56" width="80" height="18" fill="#0a5266" rx="2"/>
    <text x="18" y="69" fill="#fff">header.njk</text>
    <rect x="700" y="73" width="95" height="18" fill="#0a5266" rx="2"/>
    <text x="706" y="86" fill="#fff">entry-line</text>
    <rect x="700" y="108" width="90" height="18" fill="#0a5266" rx="2"/>
    <text x="706" y="121" fill="#fff">h1 (глітч)</text>
    <rect x="700" y="136" width="90" height="18" fill="#0a5266" rx="2"/>
    <text x="706" y="149" fill="#fff">meta</text>
    <rect x="12" y="188" width="75" height="18" fill="#0a5266" rx="2"/>
    <text x="18" y="201" fill="#fff">dropcap</text>
    <rect x="700" y="488" width="90" height="18" fill="#0a5266" rx="2"/>
    <text x="706" y="501" fill="#fff">warning</text>
    <rect x="12" y="588" width="75" height="18" fill="#0a5266" rx="2"/>
    <text x="18" y="601" fill="#fff">footer.njk</text>
  </g>
</svg>
