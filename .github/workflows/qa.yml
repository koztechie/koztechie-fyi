name: QA

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Build and site checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare failure artifacts
        run: mkdir -p qa-artifacts/logs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned ImageMagick
        run: |
          sudo apt-get update
          IM_VERSION="$(apt-cache policy imagemagick | awk '/Candidate:/ {print $2}')"
          case "$IM_VERSION" in
            8:6.9.*) ;;
            *) echo "Unsupported ImageMagick candidate: $IM_VERSION"; exit 1 ;;
          esac
          sudo apt-get install --yes "imagemagick=${IM_VERSION}" librsvg2-bin
          magick -version || convert -version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Set commit-pinned build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Verify build determinism
        run: npm run check:determinism

      - name: Build site
        run: npm run build 2>&1 | tee qa-artifacts/logs/build.log

      - name: Compare favicon and OG raster references
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/visual
          COMPARE_BIN="$(command -v compare || true)"
          if [ -z "$COMPARE_BIN" ]; then
            echo "ImageMagick compare command not found"
            exit 1
          fi
          RSVG_BIN="$(command -v rsvg-convert || true)"
          if [ -z "$RSVG_BIN" ]; then
            echo "librsvg2-bin is required for deterministic SVG rasterization"
            exit 1
          fi
          compare_ae() {
            local actual="$1"
            local reference="$2"
            local output
            output="$("$COMPARE_BIN" -metric AE "$actual" "$reference" "qa-artifacts/visual/$(basename "$actual").diff.png" 2>&1 >/dev/null || true)"
            printf '%s' "$output" | awk '{print $1}'
          }

          favicon_ae="$("$RSVG_BIN" --width 64 --height 64 dist/favicon.svg | "$COMPARE_BIN" -metric AE - docs/reference/favicon-64.png null: 2>&1 >/dev/null || true)"
          favicon_ae="$(printf '%s' "$favicon_ae" | awk '{print $1}')"
          echo "favicon AE: ${favicon_ae:-invalid}"
          test "${favicon_ae:-999999}" -le 0

          for reference in docs/reference/og/*.png; do
            name="$(basename "$reference")"
            actual="dist/og/$name"
            test -f "$actual"
            ae="$(compare_ae "$actual" "$reference")"
            echo "$name AE: ${ae:-invalid}"
            test "${ae:-999999}" -le 0
          done

      - name: Run unified QA gate
        env:
          LINKCHECK_STRICT: "1"
        run: npm run qa:all 2>&1 | tee qa-artifacts/logs/qa-all.log

      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-failure-${{ github.run_id }}
          path: |
            dist/
            qa-artifacts/logs/
            qa-artifacts/visual/
          if-no-files-found: warn
          retention-days: 7

  live-probe:
    name: Scheduled external checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned ImageMagick
        run: |
          sudo apt-get update
          IM_VERSION="$(apt-cache policy imagemagick | awk '/Candidate:/ {print $2}')"
          case "$IM_VERSION" in
            8:6.9.*) ;;
            *) echo "Unsupported ImageMagick candidate: $IM_VERSION"; exit 1 ;;
          esac
          sudo apt-get install --yes "imagemagick=${IM_VERSION}" librsvg2-bin

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build site for external link check
        run: npm run build

      - name: Probe production
        run: npm run live-probe


  measured-quality:
    name: Measured quality budgets
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install ImageMagick for build
        run: |
          sudo apt-get update
          IM_VERSION="$(apt-cache policy imagemagick | awk '/Candidate:/ {print $2}')"
          case "$IM_VERSION" in
            8:6.9.*) ;;
            *) echo "Unsupported ImageMagick candidate: $IM_VERSION"; exit 1 ;;
          esac
          sudo apt-get install --yes "imagemagick=${IM_VERSION}" librsvg2-bin

      - name: Install locked dependencies and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install locked QA tools
        run: npm ci --ignore-scripts
        working-directory: scripts/tools

      - name: Lighthouse CI
        run: npx @lhci/cli autorun --config=../../.lighthouserc.json --collect.staticDistDir=../../dist --upload.outputDir=../../qa-artifacts/lhci
        working-directory: scripts/tools

      - name: Lighthouse CI — mobile emulation
        run: npx @lhci/cli autorun --config=../../.lighthouserc.mobile.json --collect.staticDistDir=../../dist --upload.outputDir=../../qa-artifacts/lhci-mobile
        working-directory: scripts/tools

      - name: Start local static server
        run: |
          mkdir -p qa-artifacts
          nohup python3 -m http.server 4173 --directory dist > qa-artifacts/static-server.log 2>&1 &
          for attempt in $(seq 1 15); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

      - name: Install Chromium for reflow matrix
        run: npx playwright install --with-deps chromium
        working-directory: scripts/tools

      - name: A11y matrix — primary gate
        run: A11Y_MATRIX_USE_EXISTING_SERVER=1 node ../a11y-matrix.mjs
        working-directory: scripts/tools

      - name: Playwright reflow matrix — visual artifact
        run: node ../reflow-check.mjs
        working-directory: scripts/tools

      - name: Upload visual regression diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reflow-diffs-${{ github.run_id }}
          path: qa-artifacts/reflow/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Pa11y CI with axe
        run: |
          node -e '
          const {readdirSync,statSync,readFileSync,writeFileSync}=require("fs"),{join}=require("path");
          const walk=d=>readdirSync(d).flatMap(n=>{const p=join(d,n);return statSync(p).isDirectory()?walk(p):p.endsWith(".html")?[p]:[]});
          const urls=walk("dist").map(p=>"http://127.0.0.1:4173/"+p.slice(5).replace(/index\.html$/,""));
          const defaults=JSON.parse(readFileSync(".pa11yci.json","utf8")).defaults;
          writeFileSync("pa11y-urls.json",JSON.stringify({defaults,urls},null,2));'
          PA11Y_URLS_FILE=pa11y-urls.json npm run check
          PUPPETEER_EXECUTABLE_PATH="$(node -e 'process.stdout.write(require("./scripts/tools/node_modules/playwright").chromium.executablePath())')" \
            npx --prefix scripts/tools pa11y-ci --config .pa11yci.json --config pa11y-urls.json

      - name: Validate HTML specification
        run: npx html-validate --config ../../.htmlvalidate.json "../../dist/**/*.html"
        working-directory: scripts/tools

      - name: Upload measured-quality artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measured-quality-${{ github.run_id }}
          path: |
            qa-artifacts/
            qa-artifacts/a11y/matrix.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
