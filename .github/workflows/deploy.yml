name: Production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  static:
    name: Static QA gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      dist_sha256: ${{ steps.hash_dist.outputs.sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node pin (G-09)
        run: npm run check:node-pin

      - name: Verify deploy CLI pin (G-16)
        run: npm run check:deploy-pin

      - name: Install pinned ImageMagick
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -print0 \
            | xargs -0 -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 update
          IM_VERSION="$(apt-cache policy imagemagick | awk '/Candidate:/ {print $2}')"
          # Expected on ubuntu-24.04 (noble): 8:6.9.12.98+dfsg1-5.2build2.
          case "$IM_VERSION" in
            8:6.9.*) ;;
            *) echo "Unsupported ImageMagick candidate: $IM_VERSION"; exit 1 ;;
          esac
          sudo apt-get install --yes "imagemagick=${IM_VERSION}" librsvg2-bin

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Set commit-pinned build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Verify build determinism
        run: npm run check:determinism

      - name: Build site
        run: npm run build

      - name: Run unified static QA gate
        env:
          LINKCHECK_STRICT: "1"
        run: npm run qa:all

      - name: Hash deploy artifact contents
        id: hash_dist
        run: |
          digest="$(node scripts/hash-dist.mjs dist)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Static deploy artifact SHA-256: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 1

  measured-quality:
    name: Measured quality gate
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Download deterministic static build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.3.0
        with:
          name: deploy-dist-${{ github.sha }}
          path: dist

      - name: Verify measured artifact matches static build
        env:
          EXPECTED_DIST_SHA256: ${{ needs.static.outputs.dist_sha256 }}
        run: |
          actual="$(node scripts/hash-dist.mjs dist)"
          echo "Measured input artifact SHA-256: \`$actual\`" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_DIST_SHA256" || {
            echo "Measured artifact hash mismatch: expected $EXPECTED_DIST_SHA256, got $actual"
            exit 1
          }

      - name: Install pinned ImageMagick
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -print0 \
            | xargs -0 -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 update
          IM_VERSION="$(apt-cache policy imagemagick | awk '/Candidate:/ {print $2}')"
          # Expected on ubuntu-24.04 (noble): 8:6.9.12.98+dfsg1-5.2build2.
          case "$IM_VERSION" in
            8:6.9.*) ;;
            *) echo "Unsupported ImageMagick candidate: $IM_VERSION"; exit 1 ;;
          esac
          sudo apt-get install --yes "imagemagick=${IM_VERSION}" librsvg2-bin

      - name: Install locked QA tools
        run: npm ci --ignore-scripts
        working-directory: scripts/tools

      - name: Validate mobile Lighthouse gate (G-10)
        run: npm run check:lighthouse-mobile

      - name: Lighthouse CI — desktop
        run: npx @lhci/cli autorun --config=../../.lighthouserc.json --collect.staticDistDir=../../dist --upload.outputDir=../../qa-artifacts/lhci
        working-directory: scripts/tools

      - name: Lighthouse CI — mobile emulation
        run: npx @lhci/cli autorun --config=../../.lighthouserc.mobile.json --collect.staticDistDir=../../dist --upload.outputDir=../../qa-artifacts/lhci-mobile
        working-directory: scripts/tools

      - name: Start local static server
        run: |
          mkdir -p qa-artifacts
          nohup python3 -m http.server 4173 --directory dist > qa-artifacts/static-server.log 2>&1 &
          for attempt in $(seq 1 15); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium
        working-directory: scripts/tools

      - name: A11y matrix
        run: A11Y_MATRIX_USE_EXISTING_SERVER=1 node ../a11y-matrix.mjs
        working-directory: scripts/tools

      - name: Reflow matrix
        run: node ../reflow-check.mjs
        working-directory: scripts/tools

      - name: Pa11y CI with axe and HTML validation
        run: |
          node -e '
          const {readdirSync,statSync,readFileSync,writeFileSync}=require("fs"),{join}=require("path");
          const walk=d=>readdirSync(d).flatMap(n=>{const p=join(d,n);return statSync(p).isDirectory()?walk(p):p.endsWith(".html")?[p]:[]});
          const urls=walk("dist").map(p=>"http://127.0.0.1:4173/"+p.slice(5).replace(/index\.html$/,""));
          const defaults=JSON.parse(readFileSync(".pa11yci.json","utf8")).defaults;
          writeFileSync("pa11y-urls.json",JSON.stringify({defaults,urls},null,2));'
          PA11Y_URLS_FILE=pa11y-urls.json npm run check
          PUPPETEER_EXECUTABLE_PATH="$(node -e 'process.stdout.write(require("./scripts/tools/node_modules/playwright").chromium.executablePath())')" \
            npx --prefix scripts/tools pa11y-ci --config .pa11yci.json --config pa11y-urls.json
          npx --prefix scripts/tools html-validate --config .htmlvalidate.json "dist/**/*.html"

      - name: Verify measured artifact stayed unchanged
        env:
          EXPECTED_DIST_SHA256: ${{ needs.static.outputs.dist_sha256 }}
        run: |
          actual="$(node scripts/hash-dist.mjs dist)"
          echo "Measured output artifact SHA-256: \`$actual\`" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_DIST_SHA256" || {
            echo "Measured artifact changed during checks: expected $EXPECTED_DIST_SHA256, got $actual"
            exit 1
          }

      - name: Upload measured artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measured-quality-${{ github.sha }}
          path: |
            qa-artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 1

  deploy:
    name: Deploy production
    needs: [static]
    # Measured quality is advisory; only a failed static gate blocks production.
    if: ${{ !cancelled() && needs.static.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download static build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.3.0
        with:
          name: deploy-dist-${{ github.sha }}
          path: dist

      - name: Install locked QA tools
        run: npm ci --ignore-scripts
        working-directory: scripts/tools

      - name: Verify deploy artifact matches measured input
        env:
          EXPECTED_DIST_SHA256: ${{ needs.static.outputs.dist_sha256 }}
        run: |
          actual="$(node scripts/hash-dist.mjs dist)"
          echo "Production deploy artifact SHA-256: \`$actual\`" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_DIST_SHA256" || {
            echo "Deploy artifact hash mismatch: expected $EXPECTED_DIST_SHA256, got $actual"
            exit 1
          }

      - name: Deploy only after all QA gates
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          deploy_json="$(npx --prefix scripts/tools netlify deploy --prod --dir=dist --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID" --json)"
          printf '%s\n' "$deploy_json"
          deploy_id="$(printf '%s' "$deploy_json" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=JSON.parse(s);process.stdout.write(d.deploy_id||"")})')"
          test -n "$deploy_id" || { echo "Deploy JSON did not contain deploy_id"; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Post-deploy live smoke (headers/redirects/CSP parity)
        id: smoke
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: npm run live-probe:light

      - name: Auto-rollback on smoke failure
        id: rollback
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CURRENT_DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: node scripts/rollback-production.mjs

      - name: Open incident issue after smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_body="$(cat <<EOF
          Post-deploy smoke failed for production.

          - Commit: \`$COMMIT_SHA\`
          - Netlify deploy ID: \`${DEPLOY_ID:-missing}\`
          - Rollback step: \`${ROLLBACK_OUTCOME:-not-run}\`
          - Workflow run: $RUN_URL

          Review the smoke and rollback logs, verify the active production deploy, and close this issue after resolving the incident.
          EOF
          )"
          gh issue create \
            --title "Production smoke failed: ${COMMIT_SHA:0:12}" \
            --body "$issue_body"

      - name: Verify feedback channel after deploy (G-01)
        run: npm run email-dns-gate
