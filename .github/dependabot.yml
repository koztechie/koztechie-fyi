version: 2
updates:
  - package-ecosystem: npm
    directory: /scripts/tools
    target-branch: main
    schedule:
      interval: monthly
      day: "1"
      time: "06:17"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - qa-tools

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
      day: "1"
      time: "06:37"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
