version: 2
updates:
  - package-ecosystem: npm
    directory: /scripts/tools
    schedule:
      interval: monthly
      time: "06:17"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - qa-tools

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:27"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    versioning-strategy: increase
    labels:
      - dependencies
      - eleventy

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:37"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
