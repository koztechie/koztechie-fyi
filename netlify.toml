[build]
  command = "command -v magick || command -v convert || (echo 'ImageMagick required' && exit 1); npm ci --ignore-scripts && npm run build && npm run check && npm run validate && npm run size && npm run voice-lint && npm run linkcheck"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

