[build]
  # Production deploys are owned by .github/workflows/deploy.yml.
  # A Netlify Git build must never publish independently of the unified gate.
  ignore = "exit 0"
  command = "echo 'Git auto-deploy disabled: use GitHub Actions'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.2"

